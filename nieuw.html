<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FC 26 Tracker — nieuw design (kijkmodus)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>

:root{
  --bg:#0A0A0C; --card:#1C1C1E; --card-2:#232326; --line:#2C2C2F;
  --text:#FFFFFF; --muted:#8E8E93; --accent:#6C63FF; --tint:rgba(108,99,255,.20);
  --win:#30D158; --loss:#FF453A; --draw:#FFFFFF; --warn:#FF9F0A;
  --gold:#FFD60A; --silver:#C7C7CC; --bronze:#D08A3E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.glow{position:fixed;inset:0 0 auto 0;height:340px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 100% at 50% 0%,var(--tint) 0%,rgba(0,0,0,0) 72%);
  transition:background .35s}
.wrap,.tabbar,.fab{position:relative;z-index:1}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  padding-bottom:130px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* kop */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 0 16px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--card);border:none;color:var(--text);
  font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.topbar h1{flex:1;text-align:center;font-size:20px;font-weight:600;margin:0}
.topbar .spacer{width:44px;flex-shrink:0}

/* career-balk */
.career-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:16px;scrollbar-width:none}
.career-bar::-webkit-scrollbar{display:none}
.career-chip{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:16px;
  padding:9px 14px 9px 9px;white-space:nowrap;cursor:pointer;border:1px solid transparent}
.career-chip.active{border-color:var(--accent)}
.career-chip .crest{width:30px;height:30px;font-size:10px}
.career-chip b{font-size:14px;font-weight:600}
.career-chip span{font-size:12px;color:var(--muted)}

/* zoek + filters */
.search{position:relative;margin-bottom:18px}
.search i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
.search input{width:100%;background:var(--card);border:none;border-radius:16px;
  padding:15px 16px 15px 46px;color:var(--text);font-size:16px;font-family:inherit;outline:none}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:none;color:var(--muted);border-radius:14px;padding:9px 15px;
  font-size:13px;font-weight:600;font-family:inherit;white-space:nowrap;cursor:pointer}
.chip.active{background:var(--accent);color:#fff}

.section-label{font-size:19px;font-weight:600;color:var(--muted);margin:22px 2px 12px}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0 2px 16px}
.empty{color:var(--muted);text-align:center;padding:34px 0;font-size:15px}

/* clubs */
.club-card{background:var(--card);border-radius:18px;padding:18px 20px;display:flex;align-items:center;
  gap:16px;cursor:pointer;border:1px solid transparent}
.club-card.mine{border-color:var(--accent)}
.club-list{background:var(--card);border-radius:18px;overflow:hidden}
.club-row{display:flex;align-items:center;gap:16px;padding:14px 20px;cursor:pointer}
.club-row+.club-row{border-top:1px solid var(--line)}
.club-row:active,.club-card:active{background:var(--card-2)}
.crest{width:44px;height:44px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;
  align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.crest img{width:100%;height:100%;object-fit:contain;display:block}
.crest.has-logo{border-radius:0;background:none!important;overflow:visible}
.club-name{font-size:17px;font-weight:500;flex:1;min-width:0}
.club-card .club-name{font-size:18px;font-weight:600}

/* wedstrijdkaart */
.match{background:var(--card);border-radius:22px;padding:20px 16px 18px;margin-bottom:14px;
  border-top:2px solid var(--ca,transparent)}
.match-comp{text-align:center;font-size:13px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}
.side{display:flex;flex-direction:column;align-items:center;gap:10px}
.side .crest{width:58px;height:58px;font-size:17px}
.side-name{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  text-align:center;line-height:1.25;color:#EDEDED}
.score{display:flex;flex-direction:column;align-items:center;padding-top:6px;min-width:104px}
.score-line{font-size:40px;font-weight:600;line-height:1;letter-spacing:-.02em;display:flex;gap:10px;align-items:baseline}
.score-sep{color:var(--muted);font-weight:400}
.score-sub{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.comp-badge{display:flex;justify-content:center;margin-top:16px;opacity:.9}
.comp-badge .badge-img{width:36px;height:36px;object-fit:contain}
.comp-badge .badge-ph{width:36px;height:36px;border-radius:50%;
  border:1px dashed var(--ca,var(--line));display:flex;align-items:center;justify-content:center;
  color:var(--ca,#5A5A5E);font-size:11px;font-weight:700;opacity:.85}
.agg{margin-top:14px;text-align:center;font-size:12px;font-weight:600;padding:8px;border-radius:12px}
.agg.door{background:rgba(48,209,88,.14);color:var(--win)}
.agg.uit{background:rgba(255,69,58,.14);color:var(--loss)}

/* formulier */
.form-card{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:14px}
.frow{display:flex;align-items:center;gap:14px;padding:15px 18px;cursor:pointer}
.frow+.frow{border-top:1px solid var(--line)}
.frow label{font-size:15px;color:var(--muted);min-width:92px}
.frow .val{flex:1;font-size:16px;font-weight:500;text-align:right;display:flex;align-items:center;
  justify-content:flex-end;gap:10px}
.frow .val i{color:#5A5A5E;font-size:13px}
.frow.note{flex-direction:column;align-items:stretch;gap:8px}
.frow.note label{min-width:0}
.frow textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:16px;
  font-family:inherit;outline:none;min-height:62px;resize:none;padding:0}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:34px;height:34px;border-radius:50%;border:none;background:var(--card-2);
  color:var(--text);font-size:16px;cursor:pointer}
.stepper .num{font-size:24px;font-weight:600;min-width:26px;text-align:center}
.switch{width:50px;height:30px;border-radius:15px;background:var(--card-2);position:relative;cursor:pointer;flex-shrink:0}
.switch.on{background:var(--win)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:transform .18s}
.switch.on::after{transform:translateX(20px)}
.btn-main{width:100%;background:var(--accent);border:none;color:#fff;border-radius:18px;padding:17px;
  font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:8px}

/* statistieken */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border-radius:18px;padding:16px}
.tile .v{font-size:30px;font-weight:600;letter-spacing:-.02em}
.tile .l{font-size:13px;color:var(--muted);margin-top:4px}
.form-guide{display:flex;gap:7px}
.fg{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700}
.fg.w{background:rgba(48,209,88,.18);color:var(--win)}
.fg.g{background:rgba(255,159,10,.18);color:var(--warn)}
.fg.v{background:rgba(255,69,58,.18);color:var(--loss)}

/* klassement */
.trophy{background:var(--card);border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:10px}
.trophy .pos{font-size:26px;font-weight:700;min-width:64px;text-align:center}
.trophy .pos.gold{color:var(--gold)} .trophy .pos.silver{color:var(--silver)}
.trophy .pos.bronze{color:var(--bronze)} .trophy .pos.grey{color:var(--muted);font-size:14px;font-weight:600}
.trophy .tn{font-size:16px;font-weight:600} .trophy .ts{font-size:13px;color:var(--muted);margin-top:2px}

/* opstelling */
.depth{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;display:flex;
  align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
.depth-grid{display:grid;grid-template-columns:repeat(2,auto);gap:9px 22px}
.dep{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%}
.dep .dl{font-size:14px;color:#ccc;font-weight:500}
.dep .dv{font-size:15px;font-weight:700;margin-left:auto}
.pitch{position:relative;width:100%;aspect-ratio:68/100;background:linear-gradient(#1B5E20,#154D18);
  border-radius:20px;margin-bottom:14px;overflow:hidden}
.pitch::before{content:'';position:absolute;top:50%;left:6%;right:6%;height:1px;background:rgba(255,255,255,.18)}
.pitch::after{content:'';position:absolute;top:38%;bottom:38%;left:28%;right:28%;
  border:1px solid rgba(255,255,255,.15);border-radius:50%}
.pp{position:absolute;transform:translate(-50%,-50%);text-align:center;width:62px}
.pp .bub{width:40px;height:40px;border-radius:50%;background:#0B0B0D;border:2px solid #fff;margin:0 auto 3px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.pp .pn{font-size:10px;font-weight:600;text-shadow:0 1px 3px #000}
.pp .pr{font-size:9px;color:var(--gold);font-weight:700;text-shadow:0 1px 3px #000}
.plist{background:var(--card);border-radius:18px;overflow:hidden}
.prow{display:flex;align-items:center;gap:14px;padding:12px 16px}
.prow+.prow{border-top:1px solid var(--line)}
.prow .pi{flex:1;min-width:0}
.prow .pi .n{font-size:15px;font-weight:600}
.prow .pi .d{font-size:12px;color:var(--muted);margin-top:2px}
.ovr{font-size:17px;font-weight:700;color:var(--gold)}

/* transfers */
.tf{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:9px}
.tf .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.tf .ti{flex:1;min-width:0}
.tf .tn{font-size:15px;font-weight:600}
.tf .td{font-size:12px;color:var(--muted);margin-top:2px}
.tf .fee{font-size:15px;font-weight:700}

/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card);border-radius:18px;padding:14px 8px;text-align:center}
.badge i{font-size:23px}
.badge .bn{font-size:11px;font-weight:600;margin-top:8px;line-height:1.25}
.badge.locked{opacity:.32}

/* lijstrijen */
.list{background:var(--card);border-radius:18px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:14px;padding:15px 18px;cursor:pointer}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow:active{background:var(--card-2)}
.lrow .li{width:30px;color:var(--accent);font-size:16px;text-align:center;flex-shrink:0}
.lrow .lt{flex:1;font-size:16px;font-weight:500;min-width:0}
.lrow .lsub{font-size:13px;color:var(--muted);margin-top:2px;font-weight:400}
.lrow .chev{color:#5A5A5E;font-size:13px}
.rank{width:26px;font-size:17px;font-weight:700;text-align:center;color:var(--muted);flex-shrink:0}
.rank.top{color:var(--gold)}
.theme-row{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer}
.theme-row+.theme-row{border-top:1px solid var(--line)}
.swatch{width:34px;height:34px;border-radius:11px;flex-shrink:0}
.theme-row .tn2{flex:1;font-size:16px;font-weight:500;min-width:0}
.theme-row .lsub{font-size:13px;color:var(--muted);margin-top:2px;font-weight:400}
.theme-row .nu{font-size:12px;font-weight:700;color:var(--accent)}

/* competities */
.comp-row{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;
  display:flex;align-items:center;gap:14px}
.comp-logo{width:48px;height:48px;border-radius:14px;background:var(--card-2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.comp-logo.has-logo{background:none;border-radius:0;overflow:visible}
.comp-logo img{width:100%;height:100%;object-fit:contain}
.comp-logo .ph{color:#5A5A5E;font-size:16px}
.comp-info{flex:1;min-width:0}
.comp-name{font-size:16px;font-weight:600}
.comp-sub{font-size:12px;color:var(--muted);margin-top:2px}
.pill{background:var(--card-2);border:none;color:var(--text);border-radius:12px;padding:9px 14px;
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill:active{opacity:.7}

/* samenvatting */
.rev{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.rev h4{margin:0 0 10px;font-size:16px;font-weight:600}
.rline{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:14px}
.rline+.rline{border-top:1px solid var(--line)}
.rline .rl{color:var(--muted)}
.rline .rv{font-weight:600}

/* zwevende knop */
.fab{position:fixed;right:calc(50% - 260px + 16px);bottom:104px;width:56px;height:56px;border-radius:50%;
  background:var(--accent);border:none;color:#fff;font-size:20px;cursor:pointer;
  box-shadow:0 8px 22px rgba(108,99,255,.45);z-index:40}
@media(max-width:552px){.fab{right:20px}}

/* onderbalk */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(10,10,12,.98) 62%,rgba(10,10,12,0));z-index:50}
.tabbar-inner{display:flex;gap:4px;background:var(--card);border-radius:26px;padding:6px}
.tab{border:none;background:transparent;color:var(--muted);font-family:inherit;padding:9px 14px;
  border-radius:22px;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:5px;min-width:64px}
.tab i{font-size:16px}
.tab.active{background:var(--card-2);color:var(--accent)}


/* kijkmodus-balk */
.readonly{position:sticky;top:0;z-index:60;background:rgba(255,159,10,.16);
  border-bottom:1px solid rgba(255,159,10,.35);color:#FFB84D;font-size:12px;font-weight:600;
  text-align:center;padding:9px 12px;backdrop-filter:blur(8px)}
.laden{text-align:center;padding:60px 20px;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note{background:var(--card-2);border-radius:12px;padding:10px 12px;margin-top:12px;
  font-size:13px;color:#bbb;font-style:italic}
.reacties{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.reactie{background:var(--card-2);border-radius:20px;padding:4px 10px;font-size:14px}
.reactie .n{font-size:11px;color:var(--muted);margin-left:4px}

</style>
</head>
<body>
<div class="readonly"><i class="fa-solid fa-eye"></i> Kijkmodus &middot; je echte gegevens, er wordt niets opgeslagen</div>
<div class="glow"></div>
<div class="wrap"><div id="screen"><div class="laden"><div class="spin"></div>Je gegevens laden...</div></div></div>

<button class="fab" id="fab" style="display:none"><i class="fa-solid fa-plus"></i></button>

<div class="tabbar" id="tabbar" style="display:none">
  <div class="tabbar-inner">
    <button class="tab active" data-t="wedstrijden" onclick="ga('wedstrijden')"><i class="fa-solid fa-futbol"></i>Wedstrijden</button>
    <button class="tab" data-t="klassement" onclick="ga('klassement')"><i class="fa-solid fa-trophy"></i>Klassement</button>
    <button class="tab" data-t="opstelling" onclick="ga('opstelling')"><i class="fa-solid fa-users"></i>Opstelling</button>
    <button class="tab" data-t="meer" onclick="ga('meer')"><i class="fa-solid fa-ellipsis"></i>Meer</button>
  </div>
</div>

function getSpotAssignments(){if(!career)return{};const form=career.formation||'4-3-3';const spots=FORMATIONS[form]||FORMATIONS['4-3-3'];const starters=career.players.filter(p=>p.starter);const assigned={};const used=new Set();starters.filter(p=>typeof p.spotIndex==='number'&&p.spotIndex>=0&&p.spotIndex<spots.length).forEach(p=>{if(!assigned[p.spotIndex]){assigned[p.spotIndex]=p;used.add(p.id);}});const posMap={'GK':['GK'],'LB':['LB','LWB'],'RB':['RB','RWB'],'CB':['CB'],'LWB':['LWB','LB'],'RWB':['RWB','RB'],'CDM':['CDM','CM'],'CM':['CM','CDM','CAM'],'CAM':['CAM','CM','CF'],'LM':['LM','LW'],'RM':['RM','RW'],'LW':['LW','LM','ST'],'RW':['RW','RM','ST'],'ST':['ST','CF','LW','RW'],'CF':['CF','ST','CAM']};const unassigned=starters.filter(p=>!used.has(p.id));spots.forEach((spot,i)=>{if(assigned[i])return;const compatible=posMap[spot.p]||[spot.p];const match=unassigned.find(p=>compatible.includes(p.position));if(match){assigned[i]=match;used.add(match.id);unassigned.splice(unassigned.indexOf(match),1);}});spots.forEach((spot,i)=>{if(assigned[i]||!unassigned.length)return;assigned[i]=unassigned.shift();used.add(assigned[i].id);});return assigned;}

function matchOutcome(m,team){
  const isHome=m.home===team;
  const my=isHome?m.homeScore:m.awayScore;
  const their=isHome?m.awayScore:m.homeScore;
  if(my>their)return'win';
  if(my<their)return'loss';
  if(m.penalties){
    const penMy=isHome?m.penalties.home:m.penalties.away;
    const penTheir=isHome?m.penalties.away:m.penalties.home;
    if(penMy>penTheir)return'win';
    if(penMy<penTheir)return'loss';
  }
  return'draw';

  let loseStreak=0,bestLoseStreak=0;

const GENERIEK=['fc','afc','sc','ac','vfl','vfb','tsg','sv','bsc','cf','ud','cd','sd','rc','fk','ss','us'];
function initials(n){
  n=String(n||'?');
  const w=n.replace(/^\d+\.\s*/,'').split(/\s+/).filter(x=>x.length>1);
  const acr=w.find(x=>/^[A-Z]{3,}$/.test(x)); if(acr)return acr.slice(0,4);
  if(w.length===1&&/^[A-Z]{2}$/.test(w[0]))return w[0];
  const kern=w.filter(x=>!GENERIEK.includes(x.toLowerCase()));
  const b=kern.length?kern:w;
  if(!b.length)return n.slice(0,2).toUpperCase();
  return b.length===1?b[0].toUpperCase().slice(0,3):b.map(x=>x[0]).join('').toUpperCase().slice(0,3);
}

  if(!career)return kop('Badges','meer')+'<div class="empty">Nog geen career mode</div>';
  const s=calcCareerStats();
  const behaald=ACHIEVEMENTS.filter(a=>{try{return a.check(s);}catch(e){return false;}});
  return kop('Badges','meer')+'<div class="hint">'+behaald.length+' van de '+ACHIEVEMENTS.length+' behaald</div>'+
    '<div class="badges">'+ACHIEVEMENTS.map(a=>{
      let on=false;try{on=a.check(s);}catch(e){}
      return '<div class="badge'+(on?'':' locked')+'"><i class="fa-solid '+a.icon+
      '" style="color:'+(on?'var(--gold)':'var(--muted)')+'"></i><div class="bn">'+esc(a.name)+'</div></div>';}).join('')+'</div>';
}

function schermTeams(){
  const q=(window.__q||'').trim().toLowerCase();
  const mijn=career?career.team:null;
  const lijst=(data.teams||[]).filter(t=>!q||t.name.toLowerCase().includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name,'nl'));
  const eigen=lijst.find(t=>t.name===mijn);
  const rest=lijst.filter(t=>t.name!==mijn);
  return kop('Teams','meer')+
    '<div class="search"><i class="fa-solid fa-magnifying-glass"></i>'+
    '<input type="text" id="tq" placeholder="Zoeken" value="'+esc(window.__q||'')+'" oninput="zoekTeam(this.value)"></div>'+
    '<p class="hint">'+lijst.length+' teams</p>'+
    (eigen?'<div class="section-label">Mijn team</div><div class="club-card mine">'+crest(eigen.name)+
      '<div class="club-name">'+esc(eigen.name)+'</div></div>':'')+
    '<div class="section-label">Alle teams</div>'+
    (rest.length?'<div class="club-list">'+rest.map(t=>'<div class="club-row">'+crest(t.name)+
      '<div class="club-name">'+esc(t.name)+'</div></div>').join('')+'</div>':'<div class="empty">Geen teams gevonden</div>');
}
function zoekTeam(v){window.__q=v;teken();const el=document.getElementById('tq');
  if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}

function schermVrienden(){
  if(!vrienden.length)return kop('Vrienden','meer')+'<div class="laden"><div class="spin"></div>Vrienden laden...</div>';
  return kop('Vrienden','meer')+
    '<p class="hint">'+vrienden.length+' spelers gevonden</p>'+
    '<div class="list">'+vrienden.map(v=>'<div class="lrow">'+
      '<div class="li"><i class="fa-solid fa-user"></i></div>'+
      '<div class="lt">'+esc(v.name)+'<div class="lsub">'+(v.uid===mijnUid?'jij':(v.careers+' career'+(v.careers===1?'':'s')+' · '+v.matches+' wedstrijden'))+'</div></div>'+
      '</div>').join('')+'</div>';
}

const MEER=[
 {t:'Statistieken',i:'fa-chart-simple',v:'stats'},
 {t:'Transfers',i:'fa-right-left',v:'transfers'},
 {t:'Badges',i:'fa-medal',v:'badges'},
 {t:'Vrienden',i:'fa-user-group',v:'vrienden'},
 {t:'Teams',i:'fa-shield-halved',v:'teams'}
];
function schermMeer(){
  return kop('Meer')+careerBar()+
    '<div class="list">'+MEER.map(m=>'<div class="lrow" onclick="ga(\''+m.v+'\')">'+
      '<div class="li"><i class="fa-solid '+m.i+'"></i></div>'+
      '<div class="lt">'+m.t+'</div><i class="fa-solid fa-chevron-right chev"></i></div>').join('')+'</div>'+
    '<p class="hint" style="margin-top:16px">Nog niet in deze kijkversie: wedstrijden toevoegen of bewerken, klassement invullen, opstelling wijzigen, progressiegrafiek, carri&egrave;res vergelijken, head-to-head, reacties plaatsen, in- en uitloggen, importeren en back-up. Die komen erbij zodra het uiterlijk klopt.</p>';
}

/* ===== navigatie ===== */
const SCHERMEN={wedstrijden:schermWedstrijden,klassement:schermKlassement,opstelling:schermOpstelling,
  meer:schermMeer,stats:schermStats,transfers:schermTransfers,badges:schermBadges,
  vrienden:schermVrienden,teams:schermTeams};
const TABS={wedstrijden:'wedstrijden',klassement:'klassement',opstelling:'opstelling',meer:'meer',
  stats:'meer',transfers:'meer',badges:'meer',vrienden:'meer',teams:'meer'};
function ga(v){huidig=v;window.scrollTo(0,0);teken();if(v==='vrienden'&&!vrienden.length)laadVrienden();}
function teken(){
  try{
    document.getElementById('screen').innerHTML=(SCHERMEN[huidig]||schermWedstrijden)();
  }catch(e){
    document.getElementById('screen').innerHTML='<div class="empty">Er ging iets mis bij het tonen: '+esc(e.message)+'</div>';
    console.error(e);
  }
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.t===TABS[huidig]));
}

/* ===== laden (alleen lezen) ===== */
async function laadVrienden(){
  try{
    const snap=await db.collection('users').get();
    const res=[];
    for(const doc of snap.docs){
      let c=0,mm=0;
      try{
        const d=await db.collection('users').doc(doc.id).collection('data').doc('main').get();
        if(d.exists){const dd=d.data();c=(dd.careers||[]).length;
          mm=(dd.careers||[]).reduce((a,x)=>a+((x.matches||[]).length),0);}
      }catch(e){}
      res.push({uid:doc.id,name:(doc.data().name)||'Onbekend',careers:c,matches:mm});
    }
    vrienden=res.sort((a,b)=>b.matches-a.matches);
    if(huidig==='vrienden')teken();
  }catch(e){console.error('Vrienden laden mislukt',e);}
}

async function laadReacties(uid){
  try{
    const snap=await db.collection('reactions').where('ownerUid','==',uid).get();
    reacties={};
    snap.forEach(d=>{const r=d.data();(reacties[r.matchId]=reacties[r.matchId]||[]).push(r);});
  }catch(e){console.error('Reacties laden mislukt',e);}
}

auth.onAuthStateChanged(async user=>{
  if(!user){
    document.getElementById('screen').innerHTML=
      '<div class="empty" style="padding:60px 20px;line-height:1.6">Je bent nog niet ingelogd.<br><br>'+
      'Open eerst de gewone app en log daar in.<br>Kom daarna terug op deze pagina, dan worden je gegevens hier getoond.</div>';
    return;
  }
  mijnUid=user.uid;
  mijnNaam=localStorage.getItem('fc26_username')||'';
  try{
    const doc=await db.collection('users').doc(user.uid).collection('data').doc('main').get();
    if(!doc.exists){
      document.getElementById('screen').innerHTML='<div class="empty">Er zijn nog geen gegevens gevonden voor dit account.</div>';
      return;
    }
    data=doc.data()||{teams:[],careers:[],activeCareerId:null};
    if(!data.teams)data.teams=[];
    if(!data.careers)data.careers=[];
    actief=Math.max(0,data.careers.findIndex(c=>c.id===data.activeCareerId));
    career=data.careers[actief]||null;
    document.getElementById('tabbar').style.display='';
    pasThemaToe();teken();
    laadReacties(user.uid);
    setTimeout(()=>{if(huidig==='wedstrijden')teken();},1200);
  }catch(e){
    console.error(e);
    document.getElementById('screen').innerHTML='<div class="empty">Kon je gegevens niet laden: '+esc(e.message)+'</div>';
  }
});
</script>
